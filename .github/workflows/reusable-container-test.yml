---
on:
  workflow_call:

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Clean Actions Runner
        id: clean_actions_runner
        uses: ministryofjustice/analytical-platform-github-actions/clean-actions-runner@36ec5526b1400f4a5d48ad0e5957993e1401cb9f # main
        with:
          confirm: true

      - name: Set Up Container Structure Test
        id: setup_container_structure_test
        uses: ministryofjustice/analytical-platform-github-actions/setup-container-structure-test@36ec5526b1400f4a5d48ad0e5957993e1401cb9f # main

      - name: Build
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: false
          tags: ${{ github.sha }}

      - name: Test
        id: test
        shell: bash
        run: |
          container-structure-test test --platform linux/amd64 --config test/container-structure-test.yml --image ${{ github.sha }}
